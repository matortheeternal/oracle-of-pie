name: Trigger participant coverage
typeLine: Artifact - Spacecraft
text: |-
  When this Spacecraft enters, draw a card.
  Whenever this Spacecraft attacks a player alone, draw a card.
  Whenever this Spacecraft attacks a battle, it becomes tapped.
  Whenever a creature attacks one of your opponents or a planeswalker they control, draw a card.
  Whenever a creature attacks you while you're the monarch, draw a card.
  Whenever this Spacecraft becomes the target of a spell or ability you control for the first time each turn, draw a card.
  Whenever this Spacecraft becomes the target of an ability of a land you control, draw a card.
  Whenever you cast a spell that targets only a single creature you control, draw a card.
  Whenever you cast a spell that targets a creature other than this creature, draw a card.
  Whenever you cast a spell that targets only Trigger participant coverage, draw a card.
