name: Self or another subjects
typeLine: Creature
text: |-
  Whenever this creature or another creature you control enters, that creature gets +2/+0 until end of turn.
  Whenever this creature or another nontoken creature you control dies, return that card to the battlefield under your control at the beginning of the next end step.
  Whenever this creature or another Ally you control attacks, it gains first strike until end of turn.
