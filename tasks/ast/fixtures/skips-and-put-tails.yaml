name: Skips and put tails
typeLine: Creature — Human
text: |-
  Skip your next untap step.
  Put target creature card from a graveyard onto the battlefield under your control with an additional +1/+1 counter on it.
  Put target card from a graveyard back on top of its owner's library.
  Return all creatures to their owners' hands.
  Spells you control can't be copied.
  This creature enters with two +1/+1 counters on him.
