name: Counters put and transforms
typeLine: Creature
text: |-
  Whenever one or more +1/+1 counters are put on this creature for the first time each turn, draw a card.
  When the fourth plan counter is put on this creature, sacrifice it.
  Whenever this creature enters or transforms into ~, create a 1/1 white Human creature token.
  Whenever a creature you control deals combat damage to a player this turn, draw a card.
