            - kind: EffectSentence
              children:
                - kind: GrantEffect
    - kind: SpellAbility
      children:
        - kind: EffectSequence
          children:
            - kind: EffectSentence
              children:
                - kind: VoteEffect
                  options: [strength, numbers]
    - kind: SpellAbility
      children:
        - kind: EffectSequence
          children:
            - kind: EffectSentence
              children:
                - kind: VoteEffect
                  isSecret: true
                  votesOnObject: true
    - kind: SpellAbility
      children:
