name: Library and Untap Steps
typeLine: Creature — Human
text: |-
  Each player searches their library for a basic land card, puts it onto the battlefield, then shuffles.
  Discard any number of cards, then draw that many cards plus one.
  As long as your devotion to white is less than five, ~ isn't a creature.
  Untap this creature during each other player's untap step.
  When this creature enters, exile three cards at random from your graveyard.
  As it enters, choose a color.
  Look at the top four cards of your library. Put the rest of those cards on the bottom in a random order.
  Planeswalkers you control have "[−2]: Draw a card."
