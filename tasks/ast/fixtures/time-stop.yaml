name: Time Stop
typeLine: Instant
text: >-
  End the turn. (Exile all spells and abilities, including this spell. The player whose turn it
  is discards down to their maximum hand size. Damage heals and "this turn" and "until end of
  turn" effects end.)
expect:
  kind: CardText
  isRecognized: true
  children:
    - kind: SpellAbility
      children:
        - kind: EffectSequence
          children:
            - kind: EffectSentence
              children:
                - kind: EndTurnOrCombatEffect
                  raw: End the turn
                  ends: turn
