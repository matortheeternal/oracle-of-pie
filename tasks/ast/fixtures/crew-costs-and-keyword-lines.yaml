name: Crew costs and keyword lines
typeLine: Artifact — Equipment
text: |-
  This creature saddles Mounts and crews Vehicles as though its power were 2 greater.
  The escape cost is equal to its mana cost plus exile three other cards from your graveyard.
  Equip {3}. This ability costs {1} less to activate for each other Equipment you control.
  Target land gains "{T}: Add {B}." until this card is cast from exile.
  When this creature enters and whenever you spend this mana to cast a spell, draw a card.
