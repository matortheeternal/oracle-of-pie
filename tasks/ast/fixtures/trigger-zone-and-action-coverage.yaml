name: Trigger zone and action coverage
typeLine: Enchantment
text: |-
  Whenever one or more cards are put into exile from your library and/or your graveyard, draw a card.
  Whenever an artifact is put into a graveyard from the battlefield or is put into exile from the battlefield, draw a card.
  When enchanted artifact is put into a graveyard, return that card to its owner's hand.
  Whenever an opponent activates an ability of an artifact, creature, or land that isn't a mana ability, draw a card.
  Whenever you activate an exhaust ability, draw a card.
  Whenever you put one or more +1/+1 counters on a creature you control, draw a card.
  When this land enters untapped, draw a card.
  Whenever a creature you control with a counter on it dies, draw a card.
  Whenever you tap a land for mana, add one mana of any type that land produced.
  Whenever this Equipment becomes unattached from a permanent, destroy that permanent.
  Whenever one or more creature cards are put into your graveyard from anywhere, draw a card.
