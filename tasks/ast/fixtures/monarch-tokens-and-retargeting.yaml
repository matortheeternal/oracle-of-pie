name: Monarch, tokens and retargeting
typeLine: Creature — Human
text: |-
  When this creature enters, target opponent becomes the monarch.
  Whenever you become the monarch, draw a card.
  Enchanted opponent creates a Clue token, a Food token, and a Junk token.
  Change the target of target spell or ability with a single target.
  X can't be 0.
  Exile all opponents' graveyards.
  Put one into your hand and the other into your graveyard.
  If they do, untap this creature and remove it from combat.
  Choose a creature card exiled with this creature.
  You get that many {E}.
