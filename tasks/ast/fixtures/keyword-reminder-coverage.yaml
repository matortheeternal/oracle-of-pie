                              isOpaque: false
                              isAdditional: true
                              paidAsYouCast: true
                              raw: pay an additional {B} and/or {R} as you cast this spell
    - kind: KeywordAbility
      children:
        - kind: KeywordList
      expansions:
        - kind: Expansion
          children:
            - kind: CardText
              children:
                - kind: SpellAbility
                  children:
                    - kind: EffectSequence
                      children:
                        - kind: EffectSentence
                          children:
                            - kind: EntersWithCountersEffect
                              isOpaque: false
                              isPlusCounters: true
                              alternativeKeyword: haste
    - kind: KeywordAbility
      children:
        - kind: KeywordList
      expansions:
        - kind: Expansion
          children:
            - kind: CardText
              children:
                - kind: SpellAbility
