<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AST Explorer</title>
<link rel="stylesheet" href="/assets/astView.css">
<style>
#custom { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--surface); }
#custom textarea { grid-column: 1 / -1; min-height: 90px; }
#custom button { justify-self: start; }
@media (max-width: 760px) { #custom { grid-template-columns: 1fr; } }
main { max-width: 1280px; margin: 0 auto; padding: 20px 16px 60px; display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 24px; }
@media (max-width: 860px) { main { grid-template-columns: minmax(0, 1fr); } }
aside img { width: 100%; border-radius: 12px; display: block; margin-bottom: 16px; }
</style>
</head>
<body>
<header>
    <h1>AST explorer</h1>
    <input id="search" list="card-names" placeholder="Card name…" aria-label="Card name">
    <datalist id="card-names"></datalist>
    <button id="toggle-custom">Custom text</button>
    <nav><a href="/gaps">Gap workbench</a></nav>
</header>
<section id="custom" hidden>
    <input id="custom-name" placeholder="Name" aria-label="Name">
    <input id="custom-type" placeholder="Type line" aria-label="Type line">
    <input id="custom-cost" placeholder="Mana cost, e.g. {1}{G}" aria-label="Mana cost">
    <textarea id="custom-text" placeholder="Rules text" aria-label="Rules text"></textarea>
    <button id="parse-custom">Parse</button>
</section>
<main id="main"><p class="empty">Search for a card or parse custom text.</p></main>
<script type="module">
import { $, element, getJson, faceElement, summaryElement } from '/assets/astView.js';

function render(card) {
    const faces = element('div', {}, card.faces.map(faceElement));
    $('#main').replaceChildren(summaryElement(card), faces);
}

function renderError(error) {
    $('#main').replaceChildren(element('p', { className: 'empty', text: error.message }));
}

async function loadCard(name) {
    try {
        render(await getJson(`/api/ast/card?name=${encodeURIComponent(name)}`));
        history.replaceState(null, '', `?card=${encodeURIComponent(name)}`);
    } catch (error) {
        renderError(error);
    }
}

async function parseCustom() {
    const body = JSON.stringify({
        name: $('#custom-name').value || 'Custom card',
        typeLine: $('#custom-type').value,
        manaCost: $('#custom-cost').value,
        text: $('#custom-text').value
    });
    const options = { method: 'POST', headers: { 'Content-Type': 'application/json' }, body };
    try {
        render(await getJson('/api/ast/parse', options));
    } catch (error) {
        renderError(error);
    }
}

let searchTimer = null;

async function updateSuggestions() {
    const names = await getJson(`/api/ast/search?q=${encodeURIComponent($('#search').value)}`);
    $('#card-names').replaceChildren(...names.map(name => element('option', { text: name })));
}

$('#search').addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(updateSuggestions, 150);
});
$('#search').addEventListener('change', () => loadCard($('#search').value));
$('#toggle-custom').addEventListener('click', () => $('#custom').hidden = !$('#custom').hidden);
$('#parse-custom').addEventListener('click', parseCustom);

const initialCard = new URLSearchParams(location.search).get('card');
if (initialCard) {
    $('#search').value = initialCard;
    loadCard(initialCard);
}
</script>
</body>
</html>
